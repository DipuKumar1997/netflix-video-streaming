# JWT Secret
jwt.secret=${JWT_SECRET:mysupersecretkeymysupersecretkey}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# File Storage Paths
files.video=${FILES_VIDEO:videos/}
hsl.folder=${HSL_FOLDER:hsl-videos/}

# Multipart Limits
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB


save-movie-in-es-ds-preparing-for-the-search=${SAVE_MOVIE_ES_DS:save-movie-in-es-ds-preparing-for-the-search}

