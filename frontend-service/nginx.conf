server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 0; # Disables request body size limits completely

    # Proxy API requests to the backend service
    location /api {
        proxy_pass http://my-netflix-app-backend-service:8080;

        # Disable proxy timeouts (set to 1 day)
        proxy_connect_timeout 86400s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        send_timeout          86400s;
    }

    # Proxy streaming requests to the backend service
    location /stream {
        proxy_pass http://my-netflix-app-backend-service:8080;

        proxy_connect_timeout 86400s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        send_timeout          86400s;
    }

    # Proxy search requests to the search service
    location /search {
        proxy_pass http://my-netflix-app-search-service:8086;

        proxy_connect_timeout 86400s;
        proxy_send_timeout    86400s;
        proxy_read_timeout    86400s;
        send_timeout          86400s;
    }

    # Serve React frontend for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}