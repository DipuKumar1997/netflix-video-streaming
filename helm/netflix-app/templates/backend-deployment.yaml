apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
spec:
  replicas: {{ .Values.replicaCount.backend }}
  selector:
    matchLabels:
      app: netflix-backend
  template:
    metadata:
      labels:
        app: netflix-backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.images.backend }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: STORAGE_TYPE
              value: "s3"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
#            - name: MONGO_HOST
#              value: "mongodb"
#            - name: MONGO_PORT
#              value: "27017"
#            - name: AWS_ACCESS_KEY_ID
#              valueFrom:
#                  secretKeyRef:
#                    name: aws-credentials
#                    key: AWS_ACCESS_KEY_ID
#            - name: AWS_SECRET_ACCESS_KEY
#              valueFrom:
#                secretKeyRef:
#                  name: aws-credentials
#                  key: AWS_SECRET_ACCESS_KEY
          envFrom:
            - secretRef:
                name: netflix-backend-secrets
            - configMapRef:
                name: {{ .Release.Name }}-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: netflix-backend-service
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: netflix-backend